name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TVCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-apk
          path: TVCast.apk

      # A "latest" release gives you a simple download link you can open on your phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TVCast.apk \
            --title "TV Cast (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download TVCast.apk on your phone and open it to install."
